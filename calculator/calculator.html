<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算器</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

.calculator {
  width: 320px;
  padding: 20px;
  border-radius: 24px;
  background: #1f2937;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.display {
  min-height: 110px;
  padding: 12px 8px 20px;
  text-align: right;
  color: #fff;
  overflow: hidden;
}

.expression {
  min-height: 24px;
  font-size: 18px;
  color: #9ca3af;
  word-break: break-all;
}

.result {
  margin-top: 8px;
  font-size: 44px;
  font-weight: 300;
  word-break: break-all;
  line-height: 1.1;
}

.result.small {
  font-size: 30px;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.key {
  height: 62px;
  border: none;
  border-radius: 16px;
  font-size: 24px;
  cursor: pointer;
  color: #fff;
  background: #374151;
  transition: background 0.15s, transform 0.08s;
  user-select: none;
}

.key:hover {
  background: #4b5563;
}

.key:active,
.key.pressed {
  transform: scale(0.94);
}

.key.func {
  background: #6b7280;
}

.key.func:hover {
  background: #9ca3af;
}

.key.op {
  background: #f59e0b;
}

.key.op:hover {
  background: #fbbf24;
}

.key.op.active {
  background: #fff;
  color: #f59e0b;
}

.key.equal {
  background: #10b981;
}

.key.equal:hover {
  background: #34d399;
}

.key.zero {
  grid-column: span 2;
}
</style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="keys">
      <button class="key func" data-action="clear">C</button>
      <button class="key func" data-action="backspace">⌫</button>
      <button class="key func" data-action="percent">%</button>
      <button class="key op" data-op="/">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="*">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="-">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-op="+">+</button>

      <button class="key zero" data-num="0">0</button>
      <button class="key" data-action="dot">.</button>
      <button class="key equal" data-action="equal">=</button>
    </div>
  </div>

  <script>
(() => {
  const expressionEl = document.getElementById("expression");
  const resultEl = document.getElementById("result");
  const keysEl = document.querySelector(".keys");

  const OPS = ["+", "-", "*", "/"];
  const OP_SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  let expr = "";          // 内部表达式，如 "12+3*4"
  let justEvaluated = false;
  let hasError = false;

  // ---------- 工具函数 ----------
  const lastChar = () => expr.slice(-1);
  const endsWithOp = () => expr.length > 0 && OPS.includes(lastChar()) && expr !== "-";

  // 获取表达式末尾的当前数字
  const currentNumber = () => {
    const m = expr.match(/(\d+\.?\d*|\.\d+)$/);
    return m ? m[0] : "";
  };

  // 处理浮点精度问题，如 0.1 + 0.2
  const format = (n) => String(parseFloat(n.toPrecision(12)));

  const toDisplay = (s) => s.replace(/[+\-*/]/g, (op, i) =>
    // 开头的负号显示为普通负号
    i === 0 && op === "-" ? "-" : ` ${OP_SYMBOL[op]} `
  );

  // ---------- 计算（不使用 eval，支持乘除优先） ----------
  function tokenize(str) {
    const tokens = [];
    let i = 0;
    while (i < str.length) {
      const ch = str[i];
      const prev = tokens[tokens.length - 1];
      const isUnaryMinus = ch === "-" && (prev === undefined || OPS.includes(prev));
      if (/[\d.]/.test(ch) || isUnaryMinus) {
        let num = ch;
        i++;
        while (i < str.length && /[\d.]/.test(str[i])) num += str[i++];
        tokens.push(num);
      } else if (OPS.includes(ch)) {
        tokens.push(ch);
        i++;
      } else {
        throw new Error("非法字符");
      }
    }
    return tokens;
  }

  function evaluate(str) {
    const tokens = tokenize(str);
    // 第一遍：处理 * 和 /
    const stack = [parseFloat(tokens[0])];
    for (let i = 1; i < tokens.length; i += 2) {
      const op = tokens[i];
      const num = parseFloat(tokens[i + 1]);
      if (op === "*") stack.push(stack.pop() * num);
      else if (op === "/") {
        if (num === 0) throw new Error("除数不能为 0");
        stack.push(stack.pop() / num);
      } else {
        stack.push(op, num);
      }
    }
    // 第二遍：处理 + 和 -
    let result = stack[0];
    for (let i = 1; i < stack.length; i += 2) {
      result = stack[i] === "+" ? result + stack[i + 1] : result - stack[i + 1];
    }
    if (!isFinite(result)) throw new Error("结果溢出");
    return result;
  }

  // ---------- 输入处理 ----------
  function resetIfNeeded(keepResult) {
    if (hasError) {
      expr = "";
      hasError = false;
      justEvaluated = false;
    }
    if (justEvaluated) {
      if (!keepResult) expr = "";
      justEvaluated = false;
      expressionEl.textContent = "";
    }
  }

  function inputNumber(n) {
    resetIfNeeded(false);
    const cur = currentNumber();
    if (cur === "0") expr = expr.slice(0, -1); // 避免 "007"
    expr += n;
  }

  function inputDot() {
    resetIfNeeded(false);
    const cur = currentNumber();
    if (cur.includes(".")) return;
    expr += cur === "" ? "0." : ".";
  }

  function inputOperator(op) {
    resetIfNeeded(true);
    if (expr === "" || expr === "-") {
      expr = op === "-" ? "-" : "0" + op;  // 允许输入负数开头
      return;
    }
    if (lastChar() === ".") expr = expr.slice(0, -1);
    if (endsWithOp()) expr = expr.slice(0, -1); // 替换连续运算符
    expr += op;
  }

  function inputPercent() {
    resetIfNeeded(true);
    const cur = currentNumber();
    if (!cur) return;
    expr = expr.slice(0, -cur.length) + format(parseFloat(cur) / 100);
  }

  function backspace() {
    if (hasError || justEvaluated) return clearAll();
    expr = expr.slice(0, -1);
  }

  function clearAll() {
    expr = "";
    justEvaluated = false;
    hasError = false;
    expressionEl.textContent = "";
  }

  function calculate() {
    if (hasError || expr === "" || expr === "-") return;
    let e = expr;
    while (e && (OPS.includes(e.slice(-1)) || e.slice(-1) === ".")) e = e.slice(0, -1);
    if (!e) return;
    try {
      const result = format(evaluate(e));
      expressionEl.textContent = toDisplay(e) + " =";
      expr = result;
      justEvaluated = true;
    } catch (err) {
      expressionEl.textContent = toDisplay(e) + " =";
      hasError = true;
      resultEl.textContent = err.message;
      resultEl.classList.add("small");
      highlightOperator();
      return;
    }
  }

  // ---------- 渲染 ----------
  function highlightOperator() {
    document.querySelectorAll(".key.op").forEach((btn) => {
      btn.classList.toggle("active", !hasError && endsWithOp() && btn.dataset.op === lastChar());
    });
  }

  function render() {
    if (hasError) return;
    const text = expr === "" ? "0" : toDisplay(expr);
    resultEl.textContent = text;
    resultEl.classList.toggle("small", text.length > 12);
    highlightOperator();
  }

  function handle(action, value) {
    switch (action) {
      case "num": inputNumber(value); break;
      case "op": inputOperator(value); break;
      case "dot": inputDot(); break;
      case "percent": inputPercent(); break;
      case "backspace": backspace(); break;
      case "clear": clearAll(); break;
      case "equal": calculate(); break;
    }
    render();
  }

  // ---------- 事件绑定 ----------
  keysEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".key");
    if (!btn) return;
    if (btn.dataset.num !== undefined) handle("num", btn.dataset.num);
    else if (btn.dataset.op) handle("op", btn.dataset.op);
    else handle(btn.dataset.action);
  });

  // 键盘支持
  const flash = (selector) => {
    const btn = document.querySelector(selector);
    if (!btn) return;
    btn.classList.add("pressed");
    setTimeout(() => btn.classList.remove("pressed"), 100);
  };

  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (/^\d$/.test(k)) { handle("num", k); flash(`[data-num="${k}"]`); }
    else if (OPS.includes(k)) { handle("op", k); flash(`[data-op="${k}"]`); }
    else if (k === ".") { handle("dot"); flash('[data-action="dot"]'); }
    else if (k === "%") { handle("percent"); flash('[data-action="percent"]'); }
    else if (k === "Enter" || k === "=") { e.preventDefault(); handle("equal"); flash('[data-action="equal"]'); }
    else if (k === "Backspace") { handle("backspace"); flash('[data-action="backspace"]'); }
    else if (k === "Escape" || k.toLowerCase() === "c") { handle("clear"); flash('[data-action="clear"]'); }
  });

  render();
})();
</script>
</body>
</html>
